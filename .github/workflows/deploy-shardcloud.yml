# Deploy automático na ShardCloud a cada push na main.
# Configuração (uma vez só), em GitHub > Settings > Secrets and variables > Actions:
#   - Secret   SHARD_CLOUD_API_KEY = chave da API (painel ShardCloud > Config > Integrations)
#   - O ID do app fica fixo abaixo (APP_ID). Se recriar o app na ShardCloud, troque aqui.
name: Deploy na ShardCloud

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-shardcloud.yml"
  workflow_dispatch: {}   # botão "Run workflow" para deploy manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ID do app que responde em empregofacil.shardweb.app (não é segredo).
      APP_ID: bad3ea1a-fa42-4d20-b4ea-2c6dc977cc4a
    steps:
      - name: Conferir ID antigo (diagnóstico)
        env:
          ID_SECRET: ${{ secrets.SHARD_APP_ID }}
        run: |
          if [ -z "$ID_SECRET" ]; then echo "secret SHARD_APP_ID: vazio";
          elif [ "$ID_SECRET" = "$APP_ID" ]; then echo "secret SHARD_APP_ID: IGUAL ao app do site";
          else echo "secret SHARD_APP_ID: DIFERENTE do app do site (tamanho ${#ID_SECRET})"; fi

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Limpar arquivos que não vão para produção
        run: |
          rm -rf backend/tests backend/Dockerfile
          find backend -name "__pycache__" -type d -prune -exec rm -rf {} +

      # Instala a CLI direto (a action oficial consulta o GitHub sem token e cai no limite: erro 403)
      - name: Instalar a CLI da ShardCloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo shard-cloud/cli --json tagName -q .tagName)
          echo "CLI da ShardCloud: $TAG"
          curl -fsSL -o /tmp/shardcloud.tar.gz "https://github.com/shard-cloud/cli/releases/download/${TAG}/shardcloud_linux_amd64.tar.gz"
          mkdir -p /tmp/shardcloud && tar -xzf /tmp/shardcloud.tar.gz -C /tmp/shardcloud
          BIN=$(find /tmp/shardcloud -type f -name 'shardcloud*' | head -1)
          chmod +x "$BIN" && sudo mv "$BIN" /usr/local/bin/shardcloud

      - name: Enviar para a ShardCloud e reiniciar
        working-directory: ./backend
        env:
          SHARD_TOKEN: ${{ secrets.SHARD_CLOUD_API_KEY }}
        run: |
          shardcloud auth login --token "$SHARD_TOKEN"
          shardcloud app commit "$APP_ID"
          shardcloud app restart "$APP_ID"
