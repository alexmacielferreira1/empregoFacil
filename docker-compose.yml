# Ambiente local completo (padrão da Base): Postgres + Redis + API + Web com hot reload.
# Uso: docker compose up --build   ->  web: http://localhost:5173  |  API/docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: empregofacil
      POSTGRES_PASSWORD: empregofacil
      POSTGRES_DB: empregofacil
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empregofacil"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://empregofacil:empregofacil@db:5432/empregofacil
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
    volumes: ["./frontend/src:/web/src", "./frontend/public:/web/public"]

volumes:
  pgdata:
